name: CodeQL

on:
  push:
    branches: [main]
  # No base-branch filter: a pull request stacked on another feature branch
  # is still a change that has to pass before it merges, and it retargets main
  # only once its base lands, which is after review.
  pull_request:
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
