name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: a pull request stacked on another feature branch
  # is still a change that has to pass before it merges, and it retargets main
  # only once its base lands, which is after review.
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The suites start the real server, which pings the telemetry collector on
  # startup. CI is not an install: every runner has a fresh home directory and
  # would mint a new id per job, inflating the install count and spending the
  # collector's daily write budget on ourselves.
  OPA_MCP_NO_TELEMETRY: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  unit-tests:
    name: Unit tests (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm test -- --reporter=verbose

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      OPA_VERSION: '1.19.0'
      REGAL_VERSION: '0.30.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The coverage run includes integration tests (via
      # vitest.coverage.config.ts) so the report reflects every test
      # that actually exercises src/. That requires opa and regal on
      # PATH — install pinned versions before running coverage.
      - name: Install OPA
        run: |
          curl -fsSL -o /tmp/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version
      - name: Install Regal
        run: |
          curl -fsSL -o /tmp/regal \
            "https://github.com/StyraInc/regal/releases/download/v${REGAL_VERSION}/regal_Linux_x86_64"
          sudo install -m 0755 /tmp/regal /usr/local/bin/regal
          regal version
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    env:
      OPA_VERSION: '1.19.0'
      REGAL_VERSION: '0.30.0'
      CONFTEST_VERSION: '0.69.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install OPA
        run: |
          curl -fsSL -o /tmp/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version
      - name: Install Regal
        run: |
          curl -fsSL -o /tmp/regal \
            "https://github.com/StyraInc/regal/releases/download/v${REGAL_VERSION}/regal_Linux_x86_64"
          sudo install -m 0755 /tmp/regal /usr/local/bin/regal
          regal version
      - name: Install Conftest
        run: |
          curl -fsSL -o /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest
          conftest --version
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run build
      - run: npm run test:integration

  integration-tests-windows:
    name: Integration tests (Windows)
    runs-on: windows-latest
    needs: build
    # Two of the fixes in 0.5.0 were Windows-only (data mounted under the drive
    # letter; conftest joining an absolute path onto ".") and neither could be
    # seen by the Linux leg. This leg is not a required check, so a failure
    # here shows on the pull request without blocking it.
    env:
      OPA_VERSION: '1.19.0'
      REGAL_VERSION: '0.30.0'
      CONFTEST_VERSION: '0.69.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install OPA, Regal and Conftest
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest -Uri "https://openpolicyagent.org/downloads/v$env:OPA_VERSION/opa_windows_amd64.exe" -OutFile (Join-Path $tools 'opa.exe')
          Invoke-WebRequest -Uri "https://github.com/StyraInc/regal/releases/download/v$env:REGAL_VERSION/regal_Windows_x86_64.exe" -OutFile (Join-Path $tools 'regal.exe')
          Invoke-WebRequest -Uri "https://github.com/open-policy-agent/conftest/releases/download/v$env:CONFTEST_VERSION/conftest_${env:CONFTEST_VERSION}_Windows_x86_64.zip" -OutFile (Join-Path $tools 'conftest.zip')
          Expand-Archive -Path (Join-Path $tools 'conftest.zip') -DestinationPath $tools -Force
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          & (Join-Path $tools 'opa.exe') version
          & (Join-Path $tools 'regal.exe') version
          & (Join-Path $tools 'conftest.exe') --version
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run build
      - run: npm run test:integration
